[package]
name = "nsefo_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "nsefo_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20.0", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ta = "0.5" # Technical analysis library
ndarray = "0.15"
rayon = "1.8" # Parallel processing for "hundreds of symbols"
chrono = "0.4"
