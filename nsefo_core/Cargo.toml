[package]
name = "nsefo_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "nsefo_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ta = "0.5"
ndarray = "0.15"
rayon = "1.8"
chrono = "0.4"
