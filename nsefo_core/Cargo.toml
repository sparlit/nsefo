[package]
name = "nsefo_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "nsefo_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.29.0", features = ["extension-module", "abi3-py310"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ta = "0.5"
ndarray = "0.15"
rayon = "1.8"
chrono = "0.4"

# HTTP client with TLS fingerprinting support
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }

# URL parsing
url = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
