[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    unit: Unit tests — no broker API, no network
    integration: Integration tests — may call broker APIs (skip unless --run-integration specified)
    slow: Tests that take >5 seconds
asyncio_mode = auto